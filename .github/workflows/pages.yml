# Publica la web en GitHub Pages en cada push a main (y a mano: Actions → «Publicar en GitHub Pages» → Run workflow).
# Sustituye a la publicación automática de GitHub («pages build and deployment»), que fallaba o se quedaba en cola.
# La web se copia a _site sin las carpetas de trabajo (no se publican) y se sube tal cual: sin Jekyll ni build.
# Dos jobs, como la plantilla oficial de GitHub: «build» prepara y sube el artefacto, y «deploy» (needs: build) lo
# publica. En un solo job, deploy-pages buscaba el artefacto menos de un segundo después de subirlo y GitHub aún no lo
# listaba («No artifacts named github-pages»); además, relanzar el job lo subía dos veces. Así, si falla deploy, se
# relanza solo deploy (Re-run failed jobs) y usa el artefacto que ya está.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una publicación detrás de otra, sin cancelar la que está en marcha
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar la web (sin carpetas de trabajo)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude='.git/' --exclude='.github/' --exclude='_site/' \
            --exclude='_revision/' --exclude='legacy/' --exclude='docs/' --exclude='tools/' \
            --exclude='node_modules/' --exclude='.agents/' --exclude='skills-lock.json' --exclude='*.md'
          echo "Tamaño publicado: $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v6

      # los archivos con punto (.htaccess, .nojekyll, .gitignore…) no se suben: la web no necesita ninguno
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
