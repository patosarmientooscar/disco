<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <!-- Cámara provisional: capa 1/3 — cuerpo. Sustituir por body.webp (mismo encuadre 800x560). -->
  <defs>
    <linearGradient id="b-shell" x1="0" y1="110" x2="0" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2A30"/>
      <stop offset=".12" stop-color="#1B1B20"/>
      <stop offset="1" stop-color="#0E0E12"/>
    </linearGradient>
    <linearGradient id="b-plate" x1="0" y1="40" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A4A52"/>
      <stop offset=".5" stop-color="#2C2C32"/>
      <stop offset="1" stop-color="#1A1A1F"/>
    </linearGradient>
    <linearGradient id="b-grip" x1="600" y1="0" x2="745" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121216"/>
      <stop offset=".6" stop-color="#1C1C21"/>
      <stop offset="1" stop-color="#0A0A0D"/>
    </linearGradient>
    <pattern id="b-leather" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#141418"/>
      <circle cx="1.5" cy="1.5" r=".9" fill="#1E1E23"/>
      <circle cx="4.5" cy="4.5" r=".9" fill="#0F0F12"/>
    </pattern>
  </defs>

  <!-- top plate + viewfinder hump -->
  <path d="M300 128 L318 52 Q322 40 334 40 H466 Q478 40 482 52 L500 128 Z" fill="url(#b-plate)"/>
  <path d="M334 40 H466" stroke="#6A6A72" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="368" y="66" width="64" height="20" rx="4" fill="#0B0B0E"/>
  <!-- dials -->
  <rect x="108" y="88" width="96" height="30" rx="6" fill="#26262C"/>
  <rect x="112" y="80" width="88" height="14" rx="5" fill="#3A3A40"/>
  <path d="M120 80 v14 M132 80 v14 M144 80 v14 M156 80 v14 M168 80 v14 M180 80 v14 M192 80 v14" stroke="#24242A" stroke-width="2"/>
  <rect x="566" y="92" width="54" height="26" rx="6" fill="#26262C"/>
  <ellipse cx="660" cy="104" rx="30" ry="9" fill="#3A3A40"/>
  <rect x="630" y="104" width="60" height="16" fill="#2A2A30"/>
  <ellipse cx="660" cy="104" rx="22" ry="6" fill="#55555D"/>

  <!-- shell -->
  <rect x="56" y="116" width="688" height="392" rx="34" fill="url(#b-shell)"/>
  <rect x="56.75" y="116.75" width="686.5" height="390.5" rx="33.25" stroke="#3A3A40" stroke-width="1.5"/>
  <path d="M90 118 H710" stroke="#5A5A62" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>

  <!-- leatherette band -->
  <rect x="72" y="196" width="520" height="292" rx="20" fill="url(#b-leather)"/>
  <!-- grip -->
  <path d="M604 140 H700 Q736 140 736 176 V470 Q736 498 708 498 H604 Q590 498 590 484 V154 Q590 140 604 140 Z" fill="url(#b-grip)"/>
  <path d="M612 160 Q600 320 612 478" stroke="#2B2B31" stroke-width="2" stroke-linecap="round"/>
  <path d="M604 140 H700 Q736 140 736 176 V470 Q736 498 708 498 H604 Q590 498 590 484 V154 Q590 140 604 140 Z" fill="url(#b-leather)" opacity=".55"/>

  <!-- tally light (REC) -->
  <circle cx="662" cy="176" r="7" fill="#3A0B0B"/>
  <circle cx="662" cy="176" r="4" fill="#FF2B2B"/>

  <!-- lens mount shadow -->
  <circle cx="400" cy="322" r="186" fill="#060608"/>
  <circle cx="400" cy="322" r="182" stroke="#2E2E34" stroke-width="2"/>

  <!-- wordmark -->
  <!-- grabado (las web fonts no cargan en un SVG usado como <img>) -->
  <text x="96" y="164" fill="#8E8E96" font-family="'IBM Plex Mono', ui-monospace, monospace" font-weight="500" font-size="15" letter-spacing="4">DISCO.ES</text>
  <text x="96" y="184" fill="#5A5A62" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" letter-spacing="3">MADRID · 4K</text>
</svg>
