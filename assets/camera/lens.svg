<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <!-- Cámara provisional: capa 2/3 — objetivo. Sustituir por lens.webp (mismo encuadre 800x560). -->
  <defs>
    <radialGradient id="l-barrel" cx="400" cy="300" r="180" gradientUnits="userSpaceOnUse">
      <stop offset=".6" stop-color="#1A1A1F"/>
      <stop offset=".93" stop-color="#2E2E35"/>
      <stop offset="1" stop-color="#121216"/>
    </radialGradient>
    <linearGradient id="l-sheen" x1="260" y1="160" x2="540" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F2EC" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#F4F2EC" stop-opacity="0"/>
      <stop offset="1" stop-color="#F4F2EC" stop-opacity=".06"/>
    </linearGradient>
    <path id="l-ring-text" d="M400 322 m-136 0 a136 136 0 1 1 272 0 a136 136 0 1 1 -272 0"/>
  </defs>

  <!-- outer barrel -->
  <circle cx="400" cy="322" r="176" fill="url(#l-barrel)"/>
  <!-- focus ring knurling -->
  <circle cx="400" cy="322" r="166" stroke="#0A0A0D" stroke-width="16" stroke-dasharray="3 3"/>
  <circle cx="400" cy="322" r="157" stroke="#3A3A40" stroke-width="1.5"/>
  <!-- marking ring -->
  <circle cx="400" cy="322" r="146" fill="#101014"/>
  <text fill="#9A9AA2" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="3">
    <textPath href="#l-ring-text" startOffset="2%">DISCO.ES  ·  35mm  1:1.8  ·  MADRID  ·  Ø62  ·  FOCUS ∞ 0.3m</textPath>
  </text>
  <circle cx="400" cy="322" r="126" stroke="#2C2C32" stroke-width="2"/>
  <!-- inner rim -->
  <circle cx="400" cy="322" r="122" fill="#050507"/>
  <circle cx="400" cy="322" r="116" stroke="#24242A" stroke-width="4"/>
  <!-- index mark -->
  <rect x="398" y="150" width="4" height="12" rx="1" fill="#FF2B2B"/>
  <!-- sheen -->
  <circle cx="400" cy="322" r="176" fill="url(#l-sheen)"/>
  <circle cx="400" cy="322" r="175" stroke="#4A4A52" stroke-width="1.5" opacity=".6"/>
</svg>
