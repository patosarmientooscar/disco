<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>disco.es — Productora de foto y vídeo para restaurantes, discotecas y eventos en Madrid</title>
  <meta name="description" content="disco.es — Productora de foto y vídeo para restaurantes, discotecas y eventos en Madrid">
  <meta name="theme-color" content="#07070A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307070A'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FF2B2B'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/prehero.css">
  <link rel="stylesheet" href="css/hero-main.css">
  <link rel="stylesheet" href="css/loader.css">

  <script>
    document.documentElement.classList.add('js');
    // Red de seguridad: si main.js no llega, la página se muestra igualmente.
    setTimeout(function () {
      var loader = document.getElementById('loader');
      if (loader) loader.remove();
      document.documentElement.classList.remove('is-locked');
      document.body.classList.remove('is-loading');
    }, 10000);
  </script>
</head>
<body class="is-loading">
  <!-- Loading -->
  <div class="loader" id="loader">
    <p class="loader__logo" data-loader-logo aria-hidden="true">disco.es</p>
    <p class="loader__phrase" data-loader-phrase>
      <span class="sr-only">Le ponemos ritmo a tu negocio</span>
      <span class="loader__words" data-loader-words aria-hidden="true"></span>
    </p>
  </div>

  <a class="skip" href="#contenido">Saltar al contenido</a>

  <main id="contenido">
    <!-- Pre-hero: píxeles "disco.es" (pixel-field.js) + cámara del vídeo (camera-seq.js); ambos crean su canvas -->
    <section class="prehero" id="prehero" aria-label="disco.es">
      <!-- host del campo de píxeles: todo el pre-hero en desktop, la franja de arriba en móvil -->
      <div class="prehero__bg" id="prehero-bg"></div>
      <!-- capa blanca al llegar al punto blanco del vídeo -->
      <div class="prehero__white" data-whiteout aria-hidden="true"></div>
    </section>

    <!-- Hero principal: se abre desde el centro al llegar al último frame.
         tilted-grid.js inserta detrás la fila curvada de fotos. -->
    <section class="hero-main" id="hero-main" aria-labelledby="hero-main-title">
      <div class="hero-main__top">
        <h1 class="hero-main__title" id="hero-main-title" data-split>La energía, el ambiente, las historias.</h1>
        <p class="hero-main__sub" data-hero-sub>Eso es lo que se queda.</p>
      </div>
      <div class="hero-main__bottom">
        <a class="btn-rec" data-cta data-hero-cta href="#" target="_blank" rel="noopener">
          <i class="btn-rec__dot" aria-hidden="true"></i>Pide tu presupuesto
        </a>
        <p class="hero-main__tagline">Productora de foto, vídeo y edición en Madrid · Restaurantes · Discotecas · Eventos · Locales</p>
      </div>
    </section>
  </main>

  <!-- HUD mínimo: REC + timecode -->
  <div class="hud" data-hud aria-hidden="true">
    <div class="hud__slot hud__slot--tl">
      <span class="hud__rec"><i class="hud__rec-dot"></i>REC</span>
    </div>
    <div class="hud__slot hud__slot--br">
      <span class="hud__tc" data-timecode>00:00:00:00</span>
    </div>
  </div>

  <!-- CTA del pre-hero (claro); se va al empezar el scroll por la cámara -->
  <a class="cta" data-cta href="#" target="_blank" rel="noopener">
    <i class="cta__dot" aria-hidden="true"></i>Pide tu presupuesto
  </a>

  <!-- CTA fijo (oscuro) del resto de la página: aparece cuando el del hero principal sale de pantalla -->
  <a class="btn-rec btn-rec--fixed" data-cta data-cta-fixed href="#" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
    <i class="btn-rec__dot" aria-hidden="true"></i>Pide tu presupuesto
  </a>

  <div class="flash" data-flash aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
