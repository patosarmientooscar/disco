  <main id="contenido" class="ip sv">
    <!-- A) Hero en vídeo con el título entre capas (js/sv-hero.js, js/sv-video.js): el fondo en vídeo · el título ·
         delante, el chico con su cámara y sus estelas (el mismo vídeo recortado con su máscara) · velo · grano ·
         subtítulo y botones. El vídeo (hero-stack: color arriba, máscara abajo) lo pinta WebGL en dos canvas; hasta
         entonces, sin WebGL o con movimiento reducido se ven los pósters, que son su fotograma 0. Cada capa en su
         wrapper (inset −3 %) para el parallax. -->
    <header class="sv-hero" data-hero>
      <div class="sv-hero__scene" data-hero-scene>
        <div class="sv-hero__layer" data-hero-layer="bg">
          <video class="sv-hero__video" data-hero-video muted playsinline loop preload="auto" aria-hidden="true" tabindex="-1"></video>
          <picture data-hero-poster><img src="assets/servicios/hero/poster-bg.webp" width="1920" height="1072" alt="Operador de cámara caminando por un set oscuro entre estelas de luz naranja" fetchpriority="high" decoding="sync"></picture>
        </div>
        <div class="sv-hero__layer sv-hero__layer--title" data-hero-layer="title">
          <h1 class="sv-hero__title" aria-label="De la idea a la pantalla.">
            <span class="sv-mask" aria-hidden="true"><span data-hero-line>De la idea</span></span>
            <span class="sv-mask" aria-hidden="true"><span data-hero-line>A la pantalla<b class="sv-dot">.</b></span></span>
          </h1>
        </div>
        <div class="sv-hero__layer" data-hero-layer="persona" aria-hidden="true">
          <picture data-hero-poster><img src="assets/servicios/hero/poster-fg.webp" width="1920" height="1072" alt="" decoding="sync"></picture>
        </div>
      </div>
      <i class="sv-hero__veil" aria-hidden="true"></i>
      <i class="sv-hero__grain" aria-hidden="true"></i>
      <div class="sv-hero__ui">
        <p class="sv-hero__sub" data-hero-after>Pensamos, producimos y entregamos. Foto, vídeo y edición, de principio a fin.</p>
        <div class="sv-hero__cta" data-hero-after>
          <a class="sv-btn sv-btn--shine" href="contacto.html" data-cta>Pide presupuesto <b aria-hidden="true">→</b></a>
          <a class="sv-more" href="#proceso" data-to-proc>Ver cómo trabajamos</a>
        </div>
      </div>
      <i class="sv-hero__out" data-hero-out aria-hidden="true"></i>
    </header>

    <!-- B) manifiesto: se ilumina palabra a palabra con el scroll -->
